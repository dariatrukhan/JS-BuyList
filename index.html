<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Buy List - Список покупок</title>
    <meta name="description" content="Список покупок">
    <link rel="stylesheet" type="text/css" href="main.css" />
</head>

<body>
	
	<main class="bigcontainer">
			
		<section class="container1">

				<form class="form">
					<input type="text" id="name" placeholder="Назва товару">
					<button type="button" id="add" data-tooltip="Додати новий товар">Додати</button>
				</form>

				
			<ul class="items-list">
				<li class="item-row">
					<div class="buy-item">
						<span class="item-name"><s>Помідори</s></span>

						<div class="quantity-controls">
                            <button type="button" class="btn-minus22" style="display: flex;" disabled>-</button>
							<button type="button" class="btn-minus" style="display: none;" data-tooltip="Зменшити кількість">−</button>
							<span class="quantity-number">2</span>
							<button type="button" class="btn-plus" style="display: none;" data-tooltip="Збільшити кількість">+</button>				
							<button type="button" class="btn-plus2" style="display: flex;" disabled>+</button>
						</div>
						
						<div class="distt" style="display: flex;">
							<button class="decline-btn2" disabled data-tooltip="Видалити товар">×</button>
						</div>	
						<div class="item-actions">
							<button type="button" class="status-btn" style="display: none;"
								data-tooltip="Змінити статус">Куплено</button>
							<button type="button" class="status-btn2" style="display: flex;" data-tooltip="Змінити статус">Не
								куплено</button>
						</div>
						<div class="dist" style="display: none;">
							<button class="decline-btn" data-tooltip="Видалити товар">×</button>
						</div>
					</div>
				</li>

				<li class="item-row">

					<div class="buy-item">
						<p class="item-name">Печиво</p>
						<div class="quantity-controls">
							<button class="btn-minus" data-tooltip="Зменшити кількість">−</button>
							<button class="btn-minus22" style="display: none;">-</button>
							<span class="quantity-number">2</span>
							<button class="btn-plus" data-tooltip="Збільшити кількість">+</button>
							<button class="btn-plus2" style="display: none;">+</button>
						</div>
                        <div class="distt" style="display: none;">
	                        <button class="decline-btn2" data-tooltip="Видалити товар">×</button>
                        </div>
						<div class="item-actions">
							<button type="button" class="status-btn" data-tooltip="Змінити статус">Куплено</button>
							<button type="button" class="status-btn2" data-tooltip="Змінити статус"
								style="display: none;">Не куплено</button>
						</div>
						<div class="dist">
							<button class="decline-btn" data-tooltip="Видалити товар">×</button>
						</div>						
					</div>
				</li>

				<li class="item-row">
					<div class="buy-item">
						<p class="item-name">Сир</p>
						<div class="quantity-controls">
							<button class="btn-minus" disabled data-tooltip="Неможливо зменшити">−</button>
							<button class="btn-minus22" style="display: none;">-</button>
							<span class="quantity-number">1</span>
							<button class="btn-plus" data-tooltip="Збільшити кількість">+</button>
							<button class="btn-plus2" style="display: none;">+</button>
						</div>
                        <div class="distt" style="display: none;">
	                        <button class="decline-btn2" data-tooltip="Видалити товар">×</button>
                        </div>
						<div class="item-actions">
							<button type="button" class="status-btn" data-tooltip="Змінити статус">Куплено</button>
							<button type="button" class="status-btn2" data-tooltip="Змінити статус"
								style="display: none;">Не куплено</button>
						</div>
						<div class="dist">
							<button class="decline-btn" data-tooltip="Видалити товар">×</button>
						</div>						
					</div>
					
				</li>
							
			</ul>
		</section>

		<section class="container2">
			<div class="stats-group">
				<h2 class="header">Залишилося</h2>
				<ul class="content">
					<li class="badge">Печиво <span class="badge-num">2</span></li>
					<li class="badge">Сир <span class="badge-num">1</span></li>
				</ul>
			</div>
		
			<div class="stats-group">
				<h2 class="middle-line">Куплено</h2>
				<ul class="content">
					<li class="badge bought"><s>Помідори</s> <span class="badge-num"><s>2</s></span></li>
				</ul>
			</div>
		</section>

	</main>

	<footer class="footer-badge">
		<div class="badge-main">Buy List</div>
		<div class="badge-hidden-text">Created by: </div>
		<div class="badge-hidden-text2">DARIA TRUKHAN</div>
	</footer>
	
	<template id="item-template">
		<li class="item-row">
			<div class="buy-item">
				<p class="item-name"></p>

				<div class="quantity-controls">
					<button type="button" class="btn-minus" data-tooltip="Зменшити кількість" disabled>−</button>
					<button type="button" class="btn-minus22" style="display: none;">-</button>

					<span class="quantity-number">1</span>

					<button type="button" class="btn-plus" data-tooltip="Збільшити кількість">+</button>
					<button type="button" class="btn-plus2" style="display: none;">+</button>
				</div>
                <div class="distt" style="display: none;">
	                <button type="button" class="decline-btn2" data-tooltip="Видалити товар">×</button>
                </div>
				<div class="item-actions">
					<button type="button" class="status-btn" data-tooltip="Змінити статус">Куплено</button>
					<button type="button" class="status-btn2" data-tooltip="Змінити статус" style="display: none;">Не
						куплено</button>
				</div>
				<div class="dist">
					<button type="button" class="decline-btn" data-tooltip="Видалити товар">×</button>
				</div>
				
			</div>
		</li>
	</template>

<script src="script.js"></script>

</body>
</html>
